# DocumentRoot is public/, never the project root. Everything that must not
# be served over HTTP — .env, storage/, vendor/, the private photo disks —
# lives one level above it and is therefore unreachable by construction
# rather than by a deny rule somebody can delete.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The platform terminates TLS in front of this container, so the request
    # arrives as plain HTTP with the original scheme in X-Forwarded-Proto.
    # Without this, Laravel signs media URLs as http:// and every signature
    # fails when the browser follows the https:// version.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
